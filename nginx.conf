server {
  listen 80;
  server_name your.domain.com;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;

    # Security headers forwarded
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Static files can be served directly from /path/to/app/dist
  location /assets/ {
    alias /var/www/cloudspa/dist/assets/;
    access_log off;
    expires 30d;
  }

  error_log /var/log/nginx/cloudspa_error.log;
  access_log /var/log/nginx/cloudspa_access.log;
}
